<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{vista.titulo}">Vista previa</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>

<p class="no-imprimir">
    <a th:href="@{/portfolio/editar(lang='es')}">Español</a> |
    <a th:href="@{/portfolio/editar(lang='en')}">English</a>
</p>

<h1 th:text="#{vista.titulo}">Vista previa</h1>

<!-- Cada dato personal se muestra si se relleno correctamente. -->
<h2 th:if="${!#strings.isEmpty(formulario.nombre)}" th:text="${formulario.nombre}">Nombre</h2>
<p th:if="${!#strings.isEmpty(formulario.titular)}" th:text="${formulario.titular}">Titular</p>
<p th:if="${!#strings.isEmpty(formulario.presentacion)}" th:text="${formulario.presentacion}">Presentación</p>
<p th:if="${!#strings.isEmpty(formulario.ciudad)}" th:text="${formulario.ciudad}">Ciudad</p>

<!-- Si no hay correo, no se genera la seccion, ni el título -->
<section th:if="${!#strings.isEmpty(formulario.email)}">
    <h3 th:text="#{cv.contacto}">Contacto</h3>
    <p th:text="${formulario.email}">correo</p>
</section>

<h3 th:text="#{editar.proyectos}">Proyectos</h3>
<!-- Si no queda ningun proyecto , la fila vacia se descarta.-->
<p th:if="${#lists.isEmpty(proyectos)}" th:text="#{vista.sinproyectos}">Todavía no hay proyectos en este portfolio</p>
<!-- Una tarjeta por cada proyecto.-->
<div class="tarjeta" th:each="p : ${proyectos}">
    <h4 th:text="${p.titulo}">Título</h4>
    <p>
        <span th:text="${p.anio}">2026</span> ·
        <span th:switch="${p.categoria}">
            <span th:case="'aplicaciones'" th:text="#{categoria.aplicaciones}"></span>
            <span th:case="'sitios'" th:text="#{categoria.sitios}"></span>
            <span th:case="'diseno'" th:text="#{categoria.diseno}"></span>
        </span>
    </p>

    <p th:switch="${p.estado}">
        <span th:case="'en_curso'" class="etiqueta-verde" th:text="#{estado.encurso}">En curso</span>
        <span th:case="'terminado'" class="etiqueta-gris" th:text="#{estado.terminado}">Terminado</span>
    </p>
    <p th:text="${p.descripcion}">Descripción</p>
</div>
<!-- El formulario sale vacío porque no se guardan datos-->
<p class="no-imprimir">
    <a class="boton" th:href="@{/portfolio/editar}" th:text="#{vista.volver}">Volver al editor</a>
</p>

</body>
</html>
