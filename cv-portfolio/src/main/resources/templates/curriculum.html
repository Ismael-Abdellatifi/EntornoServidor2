<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>
<!-- Son los enlaces de navegacion e idiomas para poder moverte por la pagina Web.-->
<p class="no-imprimir">
    <a th:href="@{/curriculum(lang='es')}">Español</a>
    <a th:href="@{/curriculum(lang='en')}">Ingles</a>
    <a class="boton" th:href="@{/portfolio}" th:text="#{cv.portfolio}">Ver portfolio</a>
    <a class="boton" th:href="@{/portfolio/editar}" th:text="#{boton.editar}">Editar</a>
</p>
<!-- En este caso el nombre lo cogeriamos en application.properties, que viene ya asignado, y titular , como presentacion viene de nuestros controlador.-->
<h1 th:text="${nombre}">Nombre</h1>
<h2 th:text="${titular}">Titular</h2>
<p th:text="${presentacion}">Presentacion</p>
<!-- Ya que el contacto es opcional, si esta vacio, con nuestra condicion, no generaria la seccion.-->
<section th:if="${contacto!=null and !#strings.isEmpty(contacto)}">
    <h2 th:text="#{cv.contacto}">Contacto</h2>
    <p th:text="${contacto}"></p>
</section>
<!-- Nuestro th:each recorreria el array,th:switch compararia los niveles y con el span del th:case el que coincide con lo que hemos puesto y el color se ajustaria en CSS.-->
<h2 th:text="#{cv.habilidad}">Habilidades</h2>
<ul>
    <li th:each="h : ${habilidad}" th:switch="${h.nivel}">
        <span th:case="'alto'" class="nivel-alto" th:text="|${h.nombre} #{nivel.alto}|"></span>
        <span th:case="'medio'" class="nivel-medio" th:text="|${h.nombre} #{nivel.medio}|"></span>
        <span th:case="'bajo'" class="nivel-bajo" th:text="|${h.nombre} #{nivel.bajo}|"></span>

    </li>
<!--Si aniosCUrsados en nuestra condicion, se muestra como En Curso en este caso que ponga null, y seguiria estudiando , en cambio si no lo pone , apareceria el año de finalizacion.  -->
</ul>
<h2 th:text="#{cv.estudio}">Estudios</h2>
<div th:each="e : ${estudio}">
    <p><strong th:text="${e.nombre}"></strong> — <span th:text="${e.centro}"></span></p>
    <p th:if="${e.aniosCursados == null}" th:text="#{cv.encurso}">En Curso</p>
    <p th:unless="${e.aniosCursados == null}" th:text="${e.aniosCursados}">2025</p>
</div>
<!--Si tenemos el array vacio , saldria en busca de  experencia, sino pues los datos que hayamos completado en el controlador. -->
<h2 th:text="#{cv.experiencia}">Experencia Laboral</h2>
<p th:if="${#arrays.isEmpty(experiencia)}" th:text="#{cv.sinexperiencia}">En Busca de Experencia</p>
<div th:unless="${#arrays.isEmpty(experiencia)}">
    <div th:each="x : ${experiencia}">
        <p><strong th:text="${x.puesto}"></strong> — <span th:text="${x.nombreEmpresa}"></span></p>
        <p th:text="${x.periodo}"></p>
    </div>
</div>
<!-- Seguiria el mismo patron que en Habilidades-->
<h2 th:text="#{cv.idioma}">Idiomas</h2>
<ul>
    <li th:each="i : ${idioma}" th:switch="${i.nivel}">
        <span th:case="'alto'" class="nivel-alto" th:text="|${i.nombre} #{nivel.alto}|"></span>
        <span th:case="'medio'" class="nivel-medio" th:text="|${i.nombre} #{nivel.medio}|"></span>
        <span th:case="'bajo'" class="nivel-bajo" th:text="|${i.nombre} #{nivel.bajo}|"></span>
    </li>
</ul>
<!-- Aqui indicariamos con un atajo de teclado como imprimir nuestro Curriculum. -->
<p class="no-imprimir" th:text="#{cv.imprimir}">Para imprimir o guardar como PDF usa CTRL+P </p>
</body>
</html>
