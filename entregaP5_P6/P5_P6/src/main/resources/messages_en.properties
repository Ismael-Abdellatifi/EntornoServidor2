visita.title=Plan your visit
visita.subtitle=Everything you need to know before you come
visita.schedule.title=Opening hours
visita.schedule.text=Tuesday to Sunday, 10:00 to 20:00. We are closed on Mondays.
visita.access.title=Getting here
visita.access.text=We are at 12 Avenida Sevilla. You can come by car, as there is car parking available, and there is also bike parking at the door.
visita.prices.title=Tickets and prices
visita.prices.text=Entry to the centre is free. Workshops and concerts require advance booking.
visita.accessibility.title=Accessibility
visita.accessibility.text=All rooms are wheelchair accessible and the auditorium has a hearing loop.

