#Nombre base de la aplicacion en los registros de Spring Boot.
spring.application.name=P5_P6
#Indica donde buscar los archivos messages.properties y sus variantes por idioma.
spring.messages.basename=messages
#Los archivos de mensajes se guardan en UTF-8 para admitir tiles y otros caracteres.
spring.messages.encoding=utf-8
#Si falta un idioma concreto, no se depende del idioma configurado en el ordenador.
spring.messages.fallback-to-system-locale=false


