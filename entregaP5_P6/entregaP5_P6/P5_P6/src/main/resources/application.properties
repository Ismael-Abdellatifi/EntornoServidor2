#Nombre de la aplicacion que aparece en los regristros de Spring Boot.
spring.application.name=P5_P6
#Indica donde buscar los archivos messages.properties y sus variantes por idioma.
spring.messages.basename=messages
#Los archivos de mensajes se guardan en UT-8 para admitir tildes y otros caracteres.
spring.messages.encoding=utf-8
#Si falta un idioma concreto, no se depende del idioma configurado em el ordenador.
spring.messages.fallback-to-system-locale=false
